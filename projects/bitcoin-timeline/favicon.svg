      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <linearGradient id="rail" x1="6" y1="32" x2="58" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4cf"/>
